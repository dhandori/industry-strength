name: 워치리스트 차트 갱신

# 트레이딩뷰 워치리스트 종목의 1년 일봉 차트 페이지(docs/watchlist/) 자료를 하루 한 번 만든다.
# 자료는 main 에 쌓지 않고 watchlist-data 가지에 매번 덮어쓴다(저장소가 불어나지 않게).
# 이 저장소는 예약 실행이 몇 시간씩 늦는 일이 있어 여러 번 걸고, 시장 흐름판 갱신(update.yml)도 끝에서 한 번 깨운다.
# 오늘 06:10 KST 뒤에 이미 갱신했으면 10초 안에 끝난다.
on:
  schedule:
    - cron: "40 21 * * 1-5"   # 06:40 KST 화~토 (미국장 마감 뒤)
    - cron: "25 22 * * 1-5"   # 07:25 KST 재시도
    - cron: "25 23 * * 1-5"   # 08:25 KST 재시도
  workflow_dispatch:
    inputs:
      force:
        description: "이미 최신이어도 다시 받기"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "config/watchlist_tabs.json"
      - "scripts/watchlist_fetch.py"
      - ".github/workflows/watchlist.yml"

permissions:
  contents: write

concurrency:
  group: watchlist-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install "requests>=2.31"

      - name: 어제 자료 가져오기 (받지 못한 종목 대비)
        continue-on-error: true
        run: git clone --depth 1 --branch watchlist-data "https://github.com/${GITHUB_REPOSITORY}" prev

      - name: 일봉 수집·계산
        env:
          FORCE: ${{ (github.event_name == 'push' || inputs.force) && '1' || '0' }}
        run: |
          rm -rf prev/.git
          python scripts/watchlist_fetch.py config/watchlist_tabs.json out prev

      - name: 자료 올리기 (덮어쓰기)
        run: |
          if [ ! -f out/meta.json ]; then echo "새 자료 없음"; exit 0; fi
          cd out
          git init -q -b watchlist-data
          git config user.name "industry-strength-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "워치리스트 차트 자료 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" watchlist-data
