name: 미국 물가·고용 자료 갱신

on:
  # FRED 원자료: CPI(매월 중순)·고용보고서(매월 첫 금요일)·PCE(매월 말)·JOLTS(매월 초)·실업수당 청구(매주 목요일)·기대인플레·국채 금리(매일)
  # + FINRA 신용거래 통계(매월) · 네이버 증권 증시자금동향(한국 신용융자·예탁금, 매일)
  # 미국 동부 08:30 발표 = 한국 21:30(서머타임) / 22:30 → 그 뒤 밤에 한 번, 다음 날 아침에 한 번 확인한다.
  schedule:
    - cron: "20 14 * * *"   # 23:20 KST
    - cron: "20 22 * * *"   # 07:20 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/us_econ.py"
      - ".github/workflows/us-econ.yml"

permissions:
  contents: write

concurrency:
  group: us-econ
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FRED·FINRA·네이버 수집
        run: python scripts/us_econ.py
      - name: 결과 저장
        run: |
          git config user.name "industry-strength-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/us_econ.json docs/data/kr_credit.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "미국 물가·고용 자료 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
