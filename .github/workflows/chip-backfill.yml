name: 메모리 현물가 과거 이력 채우기 (수동 1회)

on:
  workflow_dispatch:
    inputs:
      from:
        description: "시작일 (YYYY-MM-DD)"
        default: "2025-01-01"

permissions:
  contents: write

concurrency:
  group: chip-prices
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/chip_backfill.py "${{ inputs.from }}"
      - name: 결과 저장
        run: |
          git config user.name "industry-strength-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/chip_prices.json
          git diff --cached --quiet && exit 0
          git commit -m "메모리 현물가 과거 이력 채움 (인터넷 기록보관소)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
