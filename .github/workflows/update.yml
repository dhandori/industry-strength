name: 산업 강도판 갱신

on:
  schedule:
    - cron: "40 7 * * 1-5"    # 한국장 마감 후 16:40 KST
    - cron: "10 9 * * 1-5"    # 한국 데이터 늦게 반영될 때 대비 18:10 KST
    - cron: "50 21 * * 1-5"   # 미국장 마감 후 06:50 KST (서머타임 해제 시 마감 06:00 KST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 가격 수집·계산
        run: python scripts/update.py

      - name: 결과 저장
        run: |
          git config user.name "industry-strength-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push
          fi
