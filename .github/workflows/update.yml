name: 시장 흐름판 갱신

on:
  # GitHub 예약 실행은 10~40분 늦거나 빠지기도 해서 여러 번 건다. 이미 최신이면 1분 안에 끝난다.
  # 시각을 바꾸면 docs/refresh.js 의 SLOTS 도 같이 바꾼다.
  schedule:
    # 마감 전에 미리 출발해 scripts/wait_close.py가 목표 시각까지 기다린다(예약 출발 지연 흡수).
    - cron: "20,35 6 * * 1-5"      # 15:20·15:35 KST 출발 → 한국 15:52 수집
    - cron: "35,50 19,20 * * 1-5"  # 미국 마감 25·10분 전 출발 → 뉴욕 16:12 수집 (서머타임 19시대 / 해제 20시대 UTC)
    # 아래는 안전망(이미 최신이면 1분 안에 끝난다).
    - cron: "40 7 * * 1-5"    # 16:40 KST 한국장 마감 후
    - cron: "10 8 * * 1-5"    # 17:10 KST 재시도
    - cron: "40 8 * * 1-5"    # 17:40 KST 재시도
    - cron: "10 9 * * 1-5"    # 18:10 KST 늦게 반영되는 가격 대비
    - cron: "30 10 * * 1-5"   # 19:30 KST 마지막 재시도
    - cron: "50 21 * * 1-5"   # 06:50 KST 미국장 마감 후 (서머타임 해제 시 마감 06:00 KST)
    - cron: "30 22 * * 1-5"   # 07:30 KST 재시도
    - cron: "30 23 * * 1-5"   # 08:30 KST 마지막 재시도
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 마감 대기
        if: github.event.schedule == '20,35 6 * * 1-5' || github.event.schedule == '35,50 19,20 * * 1-5'
        timeout-minutes: 65
        run: python scripts/wait_close.py

      - name: 가격 수집·계산
        run: python scripts/update.py
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_TRIGGER: ${{ github.event_name }}

      - name: 페어 상대강도 계산
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/pairs.py

      - name: 네이버 업종 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/naver_upjong.py

      # 섹터 워치 차트 카드(한국 업종 ETF 당일~200일 흐름). 같은 기준일 자료가 있으면 바로 끝난다.
      - name: 섹터 흐름 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/sector_flow.py

      # 외국인·기관·개인 순매수. 새 거래일 자료가 없으면 한 종목만 확인하고 바로 끝난다.
      - name: 한국 수급 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/supply_kr.py

      - name: 결과 저장 (실패해도 상태 기록)
        if: always()
        run: |
          git config user.name "industry-strength-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push
          fi
