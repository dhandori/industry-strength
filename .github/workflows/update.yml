name: 시장 흐름판 갱신

on:
  # GitHub 예약 실행은 10~40분 늦거나 빠지기도 해서 여러 번 건다. 이미 최신이면 1분 안에 끝난다.
  # 2026-10-31 11:39 KST 뒤로 이 파일의 예약만 통째로 멈춘 일이 있었다(같은 저장소 다른 작업은 정상).
  # 그럴 때는 이 파일을 한 번 다시 커밋하면 예약이 다시 등록된다(2026-11-03 조치).
  # 시각을 바꾸면 docs/refresh.js 의 SLOTS 도 같이 바꾼다.
  schedule:
    # 마감 전에 미리 출발해 scripts/wait_close.py가 목표 시각까지 기다린다(예약 출발 지연 흡수).
    - cron: "20,35 6 * * 1-5"      # 15:20·15:35 KST 출발 → 한국 15:52 수집
    - cron: "35,50 19,20 * * 1-5"  # 미국 마감 25·10분 전 출발 → 뉴욕 16:12 수집 (서머타임 19시대 / 해제 20시대 UTC)
    # 아래는 안전망(이미 최신이면 1분 안에 끝난다).
    - cron: "40 7 * * 1-5"    # 16:40 KST 한국장 마감 후
    - cron: "10 8 * * 1-5"    # 17:10 KST 재시도
    - cron: "40 8 * * 1-5"    # 17:40 KST 재시도
    - cron: "10 9 * * 1-5"    # 18:10 KST 늦게 반영되는 가격 대비
    - cron: "30 10 * * 1-5"   # 19:30 KST 마지막 재시도
    - cron: "50 21 * * 1-5"   # 06:50 KST 미국장 마감 후 (서머타임 해제 시 마감 06:00 KST)
    - cron: "30 22 * * 1-5"   # 07:30 KST 재시도
    - cron: "30 23 * * 1-5"   # 08:30 KST 마지막 재시도
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  actions: write   # 마지막 단계에서 밀린 다른 예약 작업(AI 시장 등)을 깨운다

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 마감 대기
        if: github.event.schedule == '20,35 6 * * 1-5' || github.event.schedule == '35,50 19,20 * * 1-5'
        timeout-minutes: 65
        run: python scripts/wait_close.py

      - name: 가격 수집·계산
        run: python scripts/update.py
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_TRIGGER: ${{ github.event_name }}

      - name: 페어 상대강도 계산
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/pairs.py

      - name: 네이버 업종 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/naver_upjong.py

      # 섹터 워치 차트 카드(한국 업종 ETF 당일~200일 흐름). 같은 기준일 자료가 있으면 바로 끝난다.
      - name: 섹터 흐름 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/sector_flow.py

      # 외국인·기관·개인 순매수. 새 거래일 자료가 없으면 한 종목만 확인하고 바로 끝난다.
      - name: 한국 수급 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 25   # 2026-11-06 코스피 전체+코스닥 시총 상위 300으로 넓혀 약 1,200종목
        run: python scripts/supply_kr.py

      # 종목 상세 창 차트 자료(종목별 2년 종가·거래량, 한국 수급 일별). 위 두 단계가 남긴 파일만 읽는다.
      - name: 종목 차트 자료
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/stock_charts.py

      - name: 결과 저장 (실패해도 상태 기록)
        if: always()
        run: |
          git config user.name "industry-strength-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push
          fi

      # GitHub 예약이 이 저장소에서 5~7시간씩 늦는다(2026-11-10). 이 작업은 마감 갱신 예약이 제때 걸어 주므로,
      # 오늘 돌았어야 하는데 자료가 안 바뀐 작업(AI 시장·AI 인프라·반도체 가격·미국 물가)을 여기서 바로 깨운다.
      - name: 밀린 예약 작업 깨우기
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in $(python scripts/wake_stale.py); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=1" --jq '.workflow_runs[0] | select(.status != "completed") | .created_at' || true)
            if [[ -n "$last" ]]; then echo "$wf 이미 도는 중 · 건너뜀"; continue; fi
            gh workflow run "$wf" --ref main && echo "$wf 깨움"
          done
