<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>와모 차트북</title>
<style>
:root{--pu:#a78bfa;--pul:#ede9fe;--pud:#5b21b6;--bg:#f4f5f7;--card:#fff;--line:#e3e5ea;--soft:#eef0f3;--text:#16181d;--sub:#6b7280;--ink:#374151;--up:#067a66;--dn:#f23645;--upbg:#e3f5ee;--dnbg:#fdecec;--rise:#e8313a;--fall:#1d6ae5;--risebg:#fdecec;--fallbg:#e8f0fe;--risetx:#c4161c;--falltx:#1450b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* 상단 메뉴: 화면 위에 고정. 아래로 내리면 제목·탭 줄이 위로 숨고 섹터 줄만 남는다 */
header{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);transition:transform .2s ease}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 2px 14px;max-width:1100px;margin:0 auto}
.ttl b{display:block;font-size:17px;letter-spacing:-.2px}
.ttl small{font-size:12px;color:var(--sub)}
.ttl small.old{color:var(--dn);font-weight:600}
.ic{display:flex;gap:2px}
.ic button,#vbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:54px;padding:5px 0 4px;border:0;border-radius:10px;background:none;color:#4b5563;font-size:12px}
.ic button svg,#vbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic button.on{background:var(--ink);color:#fff}
.ic button.open{background:var(--soft)}
.ic button i{position:absolute;top:2px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--dn);color:#fff;font-style:normal;font-size:12px;font-weight:700;line-height:16px;text-align:center;padding:0 3px}
.ic button i:empty{display:none}
#tabs{display:flex;padding:0 4px;border-bottom:1px solid var(--soft);max-width:1100px;margin:0 auto}
#tabs button{flex:1 1 0;min-width:0;border:0;background:none;color:var(--sub);font-size:14px;padding:8px 2px 7px;border-bottom:2.5px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button{letter-spacing:-.5px}
@media (max-width:520px){ #tabs button{font-size:13px;padding-left:0;padding-right:0} }
@media (max-width:375px){ #tabs button{font-size:12px} #tabs button[data-id=all]{padding:8px 6px 7px} }
#tabs button[data-id=all]{flex:0 0 auto;padding:8px 9px 7px}
#tabs button.on{color:var(--up);font-weight:700;border-color:var(--up)}
/* 조작 줄: 걸러 보기·정렬 단추 + 걸린 조건 칩 + 모두 지우기 + 결과 수. 메뉴를 접어도 남는다 */
#bar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 12px 2px;scrollbar-width:none;max-width:1100px;margin:0 auto}
#bar::-webkit-scrollbar{display:none}
#bar .tb{flex:none;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px;font-weight:600;padding:7px 11px}
#bar .tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar .tb.on{background:var(--ink);color:#fff}
#bar .tb.open{box-shadow:0 0 0 3px rgba(55,65,81,.18)}
#bar .tb b{font-weight:700;color:#fff;background:var(--dn);border-radius:8px;font-size:12px;min-width:17px;padding:1px 5px;text-align:center}
#bar .tb b:empty{display:none}
#chips{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px 12px 0;scrollbar-width:none;max-width:1100px;margin:0 auto}
#chips::-webkit-scrollbar{display:none}
#chips[hidden]{display:none}
#chips small{flex:none;font-size:12px;color:var(--sub)}
#chips .chip,#bar .chip{flex:none;border:0;background:#e8f1ff;color:#1e3a8a;border-radius:999px;font-size:12.5px;font-weight:600;padding:6px 10px}
#chips .chip::after,#bar .chip::after{content:" ✕";color:#64748b;font-size:12px;font-weight:400}
#bar .seg{flex:none;display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
#bar .seg button{border:0;background:var(--card);color:var(--sub);font-size:13px;padding:7px 9px;border-left:1px solid var(--line)}
#bar .seg button:first-child{border-left:0}
#bar .seg button.on{background:var(--soft);color:var(--text);font-weight:700}
#bar .lg1{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;font-size:13px;padding:7px 10px}
#bar .lg1.on{border-color:var(--ink);color:var(--text);font-weight:700;background:var(--soft)}
#bar .lg1.on::before{content:"✓ "}
@media (max-width:640px){
  /* 휴대폰: 한 줄에 다 안 들어가므로 줄바꿈. 첫 줄 걸러 보기·정렬·초기화, 둘째 줄 기간·로그·종목 수 */
  #bar{flex-wrap:wrap;overflow:visible;gap:6px 5px;padding-bottom:4px}
  #bar .tb{padding:7px 8px;gap:3px;font-size:13px}
  #bar .tb svg{width:15px;height:15px}
  #bar .seg button{padding:7px 6px;font-size:12.5px}
  #bar .lg1{padding:7px 7px;font-size:12.5px}
  #bar .clr{order:2}#bar #per{order:3}#bar #logb{order:4}#bar #cnt{order:5}
}
#bar .clr{flex:none;border:1.5px solid #f2a7a7;background:#fff5f5;color:#b91c1c;border-radius:10px;font-size:13.5px;font-weight:600;padding:7px 10px}
#bar #cnt{flex:none;font-style:normal;font-size:12px;color:var(--sub);margin-left:auto;padding-left:6px;white-space:nowrap}
#bar #cnt b{color:var(--text)}
.row{display:flex;gap:6px;overflow-x:auto;padding:7px 12px;scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain;max-width:1100px;margin:0 auto}
.row::-webkit-scrollbar{display:none}
#secs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap;user-select:none;-webkit-user-select:none}
#secs button small{font-size:12px;font-weight:400;color:var(--sub);margin-left:4px}
#secs button.on{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}
#secs button.on small{color:#fff}
#secs button:disabled{opacity:.35}
#secs #gbtn{background:var(--text);border-color:var(--text);color:#fff;font-weight:600;padding:7px 11px}
/* '▦ 전체' 옆: 이 탭의 하부섹터 묶음을 한 번에 접기·펼치기(모두 접혀 있으면 진한 보라) */
#secs #cbtn{background:var(--pul);border-color:var(--pu);color:var(--pud);font-weight:700}
#secs #cbtn.shut{background:var(--pud);border-color:var(--pud);color:#fff}
/* RS선 보는 법: 탭 맨 위에 접어 두는 안내 상자 */
.guide{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:4px 0 6px;font-size:13.5px;line-height:1.6;color:var(--ink)}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:800;color:var(--pud);list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:" ▾";color:var(--pu)}
.guide[open] summary::after{content:" ▴"}
.guide summary small{font-weight:500;color:var(--sub);margin-left:6px;font-size:12px}
.guide .gb{padding:0 14px 12px}
.guide p{margin:8px 0}
.guide p.one{background:var(--pul);border-radius:8px;padding:8px 10px;margin-top:2px}
.guide b{color:var(--text)}
.guide table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12.5px}
.guide td{border-top:1px solid var(--soft);padding:5px 4px;vertical-align:top}
.guide td:first-child{font-weight:700;color:var(--text);width:46%}
/* 섹터 제목 아래 '묶음 정의 보기': 그 섹터 하부섹터 묶음을 이름·정의·대표 종목 표로 */
.gdef{margin:-2px 0 4px}
.gdef summary{padding:8px 14px;font-size:13px}
.gdef .gr{display:grid;grid-template-columns:92px minmax(0,1fr);column-gap:10px;padding:8px 0;border-top:1px solid var(--soft);cursor:pointer}
.gdef .gr:first-child{border-top:0}
.gdef .gr b{color:var(--pud);font-size:13px;word-break:keep-all}
.gdef .gr span{font-size:13px;line-height:1.5;word-break:keep-all}
.gdef .gr small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.gdef .gr:active{background:var(--pul)}
/* 섹터 제목 줄 오른쪽 동그란 단추: 그 섹터 묶음 접기(▴)·펼치기(▾). 오른쪽 진행 표시와 안 겹치게 안쪽에 */
main > h2{position:relative;padding-right:92px}
main > h2 .sfold{position:absolute;right:44px;top:-4px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--pu);background:var(--card);color:var(--pud);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
main > h2 .sfold svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
main > h2 .sfold.shut{background:var(--pud);border-color:var(--pud);color:#fff}
/* 펼침 판(걸러 보기·정렬·섹터 전체) */
#panel{border-top:1px solid var(--soft);padding:2px 14px 12px;max-height:64vh;overflow-y:auto;max-width:1100px;margin:0 auto}
#panel[hidden]{display:none}
#panel h3{font-size:13.5px;font-weight:700;color:var(--text);margin:14px 0 7px}
#panel h3 small{font-size:12px;font-weight:400;color:var(--sub);margin-left:6px}
#panel .now{margin:10px 0 0;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:12.5px;color:var(--ink)}
#panel .now b{color:var(--text)}
#panel .now small{display:block;margin-top:4px;font-size:12px;color:var(--sub);line-height:1.45}
#panel .defs{margin:14px 0 0;padding:9px 11px;border-radius:9px;background:var(--pul);font-size:12.5px;color:var(--ink);line-height:1.5}
#panel .defs p{margin:0 0 6px}#panel .defs p:last-child{margin:0}
#panel .defs b{color:var(--pud)}
#panel .wrap{display:flex;flex-wrap:wrap;gap:6px}
#panel .opt{display:flex;align-items:center;gap:10px;margin:9px 0 0}
#panel .opt>b{flex:none;font-size:13.5px;min-width:32px}
#panel .optn{display:block;margin:4px 0 0;font-size:12px;color:var(--sub)}
#panel .wrap button{font-size:13.5px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
#panel .wrap button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
#panel .wrap button.on::before{content:"✓ "}
#panel .wrap button:disabled{opacity:.4}
#panel .wrap button small{font-size:12px;margin-left:4px;opacity:.75}
#panel .foot{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-12px;box-shadow:0 -6px 10px -6px rgba(0,0,0,.08);background:var(--card);padding:8px 0 12px;border-top:1px solid var(--soft)}
#panel .foot button{flex:1;font-size:14px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#panel .foot button.go{flex:2;background:var(--up);border-color:var(--up);color:#fff;font-weight:600}
#panel .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
#panel .grid button{text-align:left;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--card);color:var(--text)}
#panel .grid button b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .grid button span{display:block;font-size:12px;color:#4b5563;margin-top:2px;font-variant-numeric:tabular-nums}
#panel .grid button i{display:block;height:4px;border-radius:2px;background:var(--soft);margin-top:6px;overflow:hidden}
#panel .grid button i u{display:block;height:100%;background:var(--up)}
#panel .grid button:disabled{opacity:.4}
/* 하부섹터 순위 */
#panel .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:5px}
#panel .gl button{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:6px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card);color:var(--text)}
#panel .gl button i{font-style:normal;font-weight:800;color:var(--pud);font-variant-numeric:tabular-nums;grid-row:span 2}
#panel .gl button b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .gl button b small{font-size:12px;font-weight:400;color:var(--sub);margin-left:5px}
#panel .gl button span{font-size:12px;color:#4b5563;font-variant-numeric:tabular-nums}
#panel .gl.weak button{background:var(--soft);color:var(--sub)}
/* '▦ 전체' 판 맨 위: 마지막 거래일에 새로 생긴 신호. 줄 제목은 그 신호로 걸러 보기, 이름은 그 종목으로 가기 */
#panel .sgs{margin:12px 0 2px;border:1px solid #fed7aa;border-radius:11px;background:#fffaf5}
#panel .sgs summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:14px;font-weight:800;color:#9a3412}
#panel .sgs summary::-webkit-details-marker{display:none}
#panel .sgs summary::after{content:" ▾";color:#f08c00}
#panel .sgs[open] summary::after{content:" ▴"}
#panel .sgs summary small{font-size:12.5px;font-weight:600;color:#4b5563;margin-left:6px}
#panel .sgs .nn{margin:0 12px 8px;font-size:12px;color:#4b5563;line-height:1.5}
#panel .sgs .none{margin:0 12px 10px;font-size:13px;color:var(--sub)}
#panel .sgr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 4px;padding:7px 10px;border-top:1px solid #fde3cc}
#panel .sgh{flex:none;border:0;border-radius:8px;padding:5px 9px;margin-right:4px;font-size:13px;font-weight:700;background:#ffedd5;color:#9a3412}
#panel .sgh b{margin-left:5px;font-variant-numeric:tabular-nums}
#panel .sgi{flex:none;border:0;background:none;color:#c2410c;font-size:15px;line-height:1;padding:4px 6px 4px 0;margin-left:-4px;cursor:help}
#panel .sgr.bad .sgi{color:#64748b}
#panel .sgr.bad .sgh{background:#e2e8f0;color:#334155}
#panel .sgr .sgl{display:contents}
#panel .sgl button{border:0;background:none;padding:4px 4px;font-size:13px;color:var(--ink);text-decoration:underline;text-decoration-color:#d6d9df;text-underline-offset:3px}
#panel .sgl button small{font-size:12px;color:var(--sub);margin-left:3px}
#panel .sgl button.more{color:#9a3412;font-weight:700;text-decoration:none}
/* '▦ 전체' 단추 오른쪽 위 주황 알림: 새로 좋아진 종목 수. 단추 폭을 늘리지 않게 떠 있게 둔다(섹터 줄이 밀리지 않게) */
#secs #gbtn{position:relative}
#secs #gbtn i{position:absolute;top:-7px;right:-5px;font-style:normal;background:#f08c00;color:#fff;border-radius:8px;padding:0 5px;font-size:12px;line-height:16px;font-weight:700;white-space:nowrap;box-shadow:0 0 0 2px var(--card)}
#dim{position:fixed;inset:0;background:rgba(22,24,29,.28);z-index:4}
#dim[hidden]{display:none}
main{max-width:970px;margin:0 auto;padding:8px 8px 60px}
h2{font-size:15px;margin:18px 6px 8px}
/* 큰 섹터 제목: 굵은 글씨 + 연보라 밑줄 */
main > h2{font-size:20px;font-weight:900;margin:30px 4px 12px;padding-bottom:8px;border-bottom:3px solid var(--pu)}
h2 small{color:var(--sub);font-weight:400;margin-left:6px}
main > h2 small{font-size:12.5px;font-weight:500;color:#4b5563}
/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px;margin-bottom:10px}
/* 화면 밖 카드는 배치·그리기를 미룬다(전체 탭 1,100장이 처음 열릴 때 몇 초 멈추던 것). 높이는 실제 카드(535~560px)에 맞춘 어림값 */
.card{content-visibility:auto;contain-intrinsic-size:auto 545px}
.hd{display:block}
/* 첫 줄: 종목명 바로 오른쪽에 가격·오늘 등락률(이름이 길면 이름만 줄임표로 줄인다), 둘째 줄: 사업 설명 */
.nr{display:flex;align-items:baseline;gap:5px 6px;min-width:0}
.nr .nm{flex:0 1 auto}
.nr .px{flex:none;margin-left:4px}
.nr>small,.nr>em{flex:none;white-space:nowrap}
@media (min-width:700px){ .hd .biz{font-size:13.5px;line-height:1.4} }
/* 이름이 길면 두 줄까지 보여 준다(티커·국가는 이름 밖에 따로 두어 잘리지 않는다) */
.nm{font-size:16px;font-weight:700;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;line-height:1.3}
.nr>small{font-size:12px;font-weight:400;color:var(--sub)}
.nr>em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink);background:var(--soft);border-radius:5px;padding:1px 6px}
.nm .rk{display:inline-block;min-width:24px;font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:6px;padding:1px 5px;margin-right:6px;text-align:center;vertical-align:2px}
.biz{word-break:keep-all;font-size:12.5px;color:#4b5563;margin:2px 0 0;line-height:1.35}
/* 하부섹터 딱지(설명 앞)와 섹터 안 묶음 소제목 */
.biz .tg{display:inline;font-weight:700;color:var(--pud);margin-right:5px}
.tr .tg{color:var(--pud);font-weight:600}
/* 하부섹터 소제목: 연보라 알약 */
.sub{display:inline-flex;align-items:center;gap:7px;background:var(--pul);color:var(--pud);border-radius:999px;padding:6px 14px;margin:16px 0 8px 2px;font-size:14px;font-weight:800}
.sub small{color:#6d28d9;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bd .ia{background:#ede9fe;color:#5b21b6;font-weight:700}
.bd span[title],.biz .tg[title],.tr .s[title]{cursor:help}
/* 딱지는 누르면(PC는 마우스를 올리면) 뜻이 나온다: 점선 밑줄로 알린다 */
.bd span[title],.biz .tg[title]{text-decoration:underline dotted;text-decoration-color:rgba(55,65,81,.55);text-underline-offset:3px}
.hint{display:none;margin:2px 6px 6px;font-size:12px;color:#4b5563}
.hint u{text-decoration:underline dotted;text-underline-offset:3px}
@media (hover:none),(max-width:700px){ .hint{display:block} }
.tbl .sub{display:flex;width:max-content;margin:8px 10px 6px}
/* 하부섹터 요약 줄: 누르면 그 묶음을 접고 편다 */
.sub{cursor:pointer;user-select:none;flex-wrap:wrap;max-width:100%}
.sub .st{font-size:12px;font-weight:600;color:var(--ink)}
.sub .st b{font-weight:700}
.sub .st b.up{color:var(--risetx)}.sub .st b.dn{color:var(--falltx)}
.sub::after{content:"▾";font-size:11px;color:var(--pu)}
.sub.shut::after{content:"▸"}
.sub.hit{animation:hit 2.2s ease}

.tr .s svg{display:block;width:40px;height:11px;margin:3px 0 0 auto;overflow:visible}
.tr>span.s:last-child{white-space:nowrap;font-size:12.5px}
.px{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

<script>

let META = null, CUR = null, TAB = null, ITEMS = [], io = null, HEADS = [], HIDX = [], SCARDS = [], SPY = -1, LOCK = false, ROWBUSY = 0;

function fmt(v, dg){ return v.toLocaleString("en-US",{minimumFractionDigits:dg,maximumFractionDigits:dg}); }

// 카드 가격 자릿수: 원화·엔화 종목(.KS .KQ .T)은 소수점 없이

// 종목 통화: 기호 끝(상장 거래소)으로 정한다. [통화 코드, 한글 이름]. 표에 없는 거래소는 거래대금을 쓰지 않는다
const CCY = {"": ["USD","달러"], KS: ["KRW","원"], KQ: ["KRW","원"], T: ["JPY","엔"], SS: ["CNY","위안"], SZ: ["CNY","위안"],
             TW: ["TWD","대만달러"], TWO: ["TWD","대만달러"], HK: ["HKD","홍콩달러"], DE: ["EUR","유로"], AS: ["EUR","유로"], PA: ["EUR","유로"], SW: ["CHF","스위스프랑"]};

  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw) || raw;
  const out = [];
  for (let v = Math.ceil(lo/step)*step; v <= hi + step*1e-9; v += step) out.push(v);

// 차트 기간: 3m·6m·1y. 받은 자료는 1년 치이고 그중 최근 63·126거래일만 잘라 그린다(봉이 굵어져 꼬리가 잘 보인다).
const PERIODS = [["3m","3개월",63],["6m","6개월",126],["1y","1년",0]];
function draw(cv, it0){
  const K = (PERIODS.find(p => p[0] === period()) || [])[2] || 0;
  const it = !K || it0.c.length <= K ? it0 : (() => { const cut = a => a.slice(a.length - K);
    return {...it0, o: cut(it0.o), h: cut(it0.h), l: cut(it0.l), c: cut(it0.c), v: cut(it0.v), d: cut(it0.d),
            e: Object.fromEntries(Object.entries(it0.e).map(([k, a]) => [k, cut(a)])), rl: it0.rl && cut(it0.rl)}; })();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = cv.clientWidth, H = cv.clientHeight;

  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const n = it.c.length, hasVol = it.v.some(v => v > 0);
  let axW = 50;
  const padT = 6, xH = 18;
  const volH = hasVol ? 46 : 0, gap = hasVol ? 6 : 0;
  // RS선 칸(종목 ÷ 상장 시장 지수): 거래량 아래 44px
  const rl = it.rl && it.rl.some(v => v != null) ? it.rl : null, rsH = rl ? 44 : 0, rgap = rl ? 8 : 0;
  const pH = H - padT - xH - volH - gap - rsH - rgap;

  // 가격 눈금 칸 폭: 글씨가 12px 이상이라 자리가 넓은 종목(원화 100만 원대 등)은 칸을 넓힌다

  { const lt = fmt(it.c[n-1], it.c[n-1] >= 10000 ? 0 : it.c[n-1] >= 1000 ? 1 : it.dg), ht = fmt(hi, hi >= 10000 ? 0 : hi >= 1000 ? 1 : it.dg);
    axW = Math.max(54, Math.ceil(Math.max(g.measureText(lt).width, g.measureText(ht).width)) + 10); pW = W - axW; }
  // 로그 축(기본): 같은 비율의 움직임을 같은 높이로. 0 이하 값이 있으면 그릴 수 없어 선형으로 그린다.
  const LOG = ST.log !== false && lo > 0;
  const T = LOG ? Math.log : (v => v), TI = LOG ? Math.exp : (v => v);
  { const a = T(lo), b = T(hi), pad = (b - a) * 0.04 || (LOG ? 0.01 : 1); lo = TI(a - pad); hi = TI(b + pad); }
  const tlo = T(lo), thi = T(hi);

  const slots = n + 5, sw = pW / slots;

// RS선 칸: 선이 오르면 시장보다 강해지는 중. 점선은 1년 중 RS선 최고 자리, 파란 점은 오늘이 그 신고가일 때.

function drawRs(g, it0, it, rl, X, n, pW, top, rsH, rgap){

  rl.forEach((v, i) => { if (v == null){ on = false; return; } on ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); on = true; });

// ── 종목별 계산값: 기간 수익률, 거래량 배수, 52주 범위 위치 ──

// ── 추세추종 지표(2026-11-21). 종목(국가가 있는 것)만. 단순이동평균은 저장된 종가로 여기서 구한다 ──
const sma = (c, k, end) => { if (end + 1 < k) return null; let t = 0; for (let i = end - k + 1; i <= end; i++) t += c[i]; return t / k; };

}
// 포켓 피봇(길 모랄레스·크리스 캐처): j번째 날 종가가 전날보다 높고, 거래량이 직전 10거래일 가운데 내린 날 거래량의 최대치보다 많고,
// 종가가 50일 단순이동평균 위(상승 추세 안). 직전 10거래일에 내린 날이 하루도 없으면 보지 않는다.
function ppAt(it, j){
  const c = it.c, v = it.v;

// 차트의 포켓 피봇 점: 날마다 한 번만 계산해 둔다(차트를 그릴 때만)

  let hi = 0; for (let i = 1; i < n; i++) if (c[i] >= c[hi]) hi = i;
  m.hid = j - hi;
}

function loadFx(){
  if (!FXP) FXP = fetch(`${DATA}macro.json?t=${encodeURIComponent(META.updated)}`).then(r => r.json()).then(d => {
    const last = {};
    d.sections.forEach(s => s.items.forEach(x => { last[x.y] = x.c[x.c.length - 1]; }));
    if (last["KRW=X"] > 0) FX = {USD: 1, KRW: last["KRW=X"], JPY: last["JPY=X"], CNY: last["CNY=X"], TWD: last["TWD=X"], HKD: 7.8};

    return FX;
  }).catch(() => { FXP = null; return null; });
  return FXP;
}

  adr: "최근 20거래일 동안 하루 고가 ÷ 저가 − 1의 평균(ADR%)입니다. 높은 순으로 보면 하루에 크게 움직이는 종목이, 낮은 순으로 보면 얌전한 종목이 먼저 나옵니다. 손절폭을 이 값보다 좁게 잡으면 평소 흔들림만으로도 손절이 걸리기 쉽습니다.",

const KORDER = ["미국","한국","중국","일본","대만","기타"];
const kgroup = k => !k ? "" : k === "홍콩" ? "중국" : KORDER.includes(k) ? k : "기타";

// c: 조건, k: 국가, s: 정렬 기준, d: desc(높은 순)|asc(낮은 순), v: chart|list, g: sec(섹터별)|all(탭 전체 한 줄)
let ST = {c: [], k: [], s: "base", d: "desc", v: "chart", g: "sec", p: "", log: true};
try { Object.assign(ST, JSON.parse(store.get("wl.st") || "{}")); } catch(e){}
{ const mv = {"chg-":["chg","desc"],"chg+":["chg","asc"],"chgr":["chg","asc"],"ph":["pos","desc"],"posr":["pos","asc"],"pl":["base","desc"]}[ST.s]; if (mv) [ST.s, ST.d] = mv; }
if (ST.d !== "asc") ST.d = "desc";
if (!SORT[ST.s]) ST.s = "base";
ST.c = (ST.c || []).filter(c => COND[c]); ST.k = (ST.k || []).filter(k => KORDER.includes(k));
{ const old = store.get("wl.flt"); if (old && COND[old] && !store.get("wl.st")) ST.c = [old]; }
const save = () => store.set("wl.st", JSON.stringify(ST));
// 기간을 고른 적이 없으면 화면 폭 600px 미만(휴대폰) 3개월, 900px 미만 6개월, 그 밖에 1년. 고른 기간은 브라우저에 기억해 그쪽이 먼저
const period = () => PERIODS.some(p => p[0] === ST.p) ? ST.p : (window.innerWidth < 600 ? "3m" : window.innerWidth < 900 ? "6m" : "1y");
const hasK = data => data.sections.some(s => s.items.some(it => it.k));
const active = data => ST.c.length + (hasK(data) ? ST.k.length : 0);
function tester(data){
  const useK = hasK(data) && ST.k.length;
  return it => ST.c.every(c => COND[c][2](it)) && (!useK || ST.k.includes(kgroup(it.k)));
}
// 같은 회사가 두 곳에 상장돼 둘 다 들어 있으면(TSMC, 토요타, 중국 A·H주 등) 순위를 볼 때 하나만 남긴다.
// 미국 상장(기호에 점이 없는 것)을 남기고, 둘 다 미국 밖이면 먼저 나온 것을 남긴다.
// 영문 이름이 같아도 한글 이름이 서로 다르면 다른 회사로 본다(소프트뱅크그룹 9984.T와 통신사 소프트뱅크 9434.T, 2026-11-23).
function dupSet(data){
  const by = {}, drop = new Set(), kn = knMap();
  drop.of = {};  // 빠지는 상장 → 남기는 상장
  data.sections.forEach(s => s.items.forEach(it => (by[it.n] = by[it.n] || []).push(it)));
  Object.values(by).forEach(list => {
    if (list.length < 2) return;
    const names = [...new Set(list.map(it => kn[it.y]).filter(Boolean))];
    const parts = names.length > 1 ? names.map(k => list.filter(it => kn[it.y] === k)) : [list];
    // 한글 이름으로 회사가 둘 이상 갈리면 한글 이름이 없는 상장은 어느 회사인지 몰라 따로 둔다(빼지 않는다)
    parts.forEach(p => {
      if (p.length < 2) return;
      const keep = p.find(it => !it.y.includes(".") && !it.y.startsWith("^")) || p[0];
      p.forEach(it => { if (it !== keep){ drop.add(it.y); drop.of[it.y] = keep.y; } });
    });
  });
  return drop;
}

// ── 카드 ──
const CROSS = {gc:["xg","골든크로스 발생"], gs:["xg","골든크로스 임박"], dc:["xd","데드크로스 발생"], ds:["xd","데드크로스 임박"]};

    "손절폭을 이보다 좁게 잡으면 평소 흔들림만으로도 손절이 걸리기 쉽습니다.",
  sd: it => { const m = it.m, x = m.adr ? m.sd / m.adr : null;
    return `최근 10거래일 가운데 가장 낮은 가격(저가 ${px(it, m.lo10)})이 오늘 종가보다 ${m.sd.toFixed(1)}% 아래에 있습니다.` +
      (x != null ? ` 하루 변동폭의 ${x.toFixed(1)}배입니다.` : "") + "\n\n" +
      (m.sd > 10 ? "올투 기준 손절폭은 7~10%입니다. 이 저점은 그보다 멀어서, 저점에 닿기 전에 −7~10%에서 먼저 손절하게 됩니다."
        : x != null && x < 1 ? "저점이 하루 변동폭보다 가까워, 저점 바로 아래에 손절가를 두면 평소 흔들림에도 걸리기 쉽습니다."
        : "저점이 올투 기준 손절폭(7~10%) 안쪽이라, 저점 바로 아래를 손절가로 삼을 수 있습니다."); },
  d50: it => { const m = it.m, d = (m.s50 / lastOf(it.c) - 1) * 100;
    return `50일 단순이동평균(${px(it, m.s50)})이 오늘 종가보다 ${Math.abs(d).toFixed(1)}% ${d <= 0 ? "아래" : "위"}에 있습니다. ` +
      (d <= 0 ? "추세추종에서는 큰 거래량을 실으며 50일선을 깨면 파는 신호로 봅니다." : "종가가 50일선 아래라 추세가 약해진 상태입니다."); },

};
function card(it, idx, rank){
  const ld = it.d[it.d.length - 1], sk = SORT[EFF], pd = pdg(it);

    `<div class="biz"></div><div class="bd"></div></div>` +
    `<canvas data-i="${idx}"${it.rl ? ' class="rl"' : ""}></canvas>` +
    `<div class="lg"><span>지수이동평균(EMA)</span>${EMA.map(([k,c]) => `<span class="lw"><i style="border-color:${c}"></i>${k}일</span>`).join("")}` +

    (it.k && it.v.some(v => v > 0) ? `<span class="lw lpp"><i class="pp"></i>포켓 피봇</span>` : "") +
    `<span class="lr">${+ld.slice(2,4)}/${+ld.slice(4,6)} 종가 기준</span></div>`;
  const lpp = el.querySelector(".lpp"); if (lpp) lpp.title = DEF.pp;
  const nm = el.querySelector(".nm");
  if (rank) nm.appendChild(span("rk", rank));
  nm.appendChild(document.createTextNode(it.n));
  // 티커·국가는 이름 칸 밖에 둔다(이름이 길어 두 줄이 되어도 잘리지 않게)
  const sm = document.createElement("small"); sm.textContent = it.y; nm.after(sm);
  if (it.k){ const em = document.createElement("em"); em.textContent = it.k; sm.after(em); }
  const bz = el.querySelector(".biz");
  if (it.t && it.t.length) bz.appendChild(span("tg", it.t.join(" · "), "하부섹터 딱지입니다. 첫 딱지가 같은 종목끼리 섹터 안에서 한 묶음으로 모입니다."));
  if (it.b) bz.appendChild(document.createTextNode(it.b));
  if (!bz.childNodes.length) bz.remove();
  const bd = el.querySelector(".bd");
  // 정렬 중이면 그 기준 값을 맨 앞에 노랗게(오늘 등락률은 가격 옆에 이미 있으니 뺀다)
  if (sk.key && sk.id !== "chg" && has(sk, it)) bd.appendChild(span("sk", sk.lab + " " + sk.val(it), (sk.id === "tt" ? ttTip(it) : "지금 정렬 기준인 " + sk.name + " 값입니다.\n\n" + (DEF[sk.id] || ""))));
  if (it.ia) bd.appendChild(span("ia", "액션 · " + it.ia.g + " " + it.ia.k + "위/" + it.ia.of + (it.ia.d <= 5 ? " · 새로" : " · " + it.ia.d + "일째"), TIP.ia(it)));

  const nw = k => sig(it, k), ntt = nw("n_tt"), nal = nw("n_al"), nrs = nw("n_rsh");
  if (nw("n_hi")) bd.appendChild(span("hb nw", "52주 신고가 돌파", DEF.n_hi));

  if (nw("x_tt")) bd.appendChild(span("wn", "템플릿 이탈", DEF.x_tt + "\n\n" + ttTip(it)));
  if (it.al) bd.appendChild(span(nal ? "al nw" : "al", nal ? "정배열 · 새로" : "정배열", DEF.al + (nal ? "\n\n" + DEF.n_al : "")));
  if (nw("x_al")) bd.appendChild(span("wn", "정배열 이탈", DEF.x_al));

  const rsTxt = nrs ? "신고가 돌파" : "신고가", rsDef = nrs ? "RS선 신고가 돌파: " + DEF.n_rsh : "RS선 신고가: " + DEF.rsh;
  if (it.rs != null && EFF !== "rs") bd.appendChild(span((it.rs >= 80 || it.rsh ? "rh" : "") + (nrs ? " nw" : ""), "RS " + it.rs + rsArrow(it) + (it.rsh ? " · " + rsTxt : ""),

  if (it.k){

// ── 표 형태 목록: 종목 | 오늘 | 1개월 | 52주 위치 | RS. 칸 제목을 누르면 그 기준으로 정렬, 줄을 누르면 차트를 편다 ──
const COLS = [["종목","base"],["오늘","chg"],["1개월","r1m"],["52주","pos"],["RS","rs"]];

    b.classList.toggle("on", EFF === id && id !== "base"); b.classList.toggle("asc", ST.d === "asc");

function tableRow(it, idx, rank){

    `<span>${Math.round(it.m.pos)}%<i class="mb"><u style="left:calc(${Math.max(0, Math.min(100, it.m.pos))}% - 1px)"></u></i></span>` +
    `<span class="s">${it.rs == null ? "–" : it.rs + rsArrow(it)}${spark(it)}</span>`);
  if (it.rs != null) r.lastElementChild.title = TIP.rs(it);

// 표의 RS 칸 아래 작은 선: 최근 63거래일 RS선(오르면 시장보다 강해지는 중)
function spark(it){
  const v = (it.rl || []).slice(-63).filter(x => x != null);
  if (v.length < 10) return "";
  const lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const pts = v.map((x, i) => (i / (v.length - 1) * 34).toFixed(1) + "," + (10 - (x - lo) / r * 10).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 34 11"><polyline points="${pts}" fill="none" stroke="${it.rs >= 80 ? RSC : "#8a93a3"}" stroke-width="1.3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

// ── 하부섹터 묶음: 요약 줄을 누르면 접고 편다(처음엔 펼침, 접은 묶음은 브라우저에 기억) ──
let SHUT = new Set();
try { SHUT = new Set(JSON.parse(store.get("wl.shut") || "[]")); } catch(e){}
function grpStat(mem){
  const r = mem.map(x => x.m.r1m).filter(v => v != null);
  return {n: mem.length, al: mem.filter(x => x.al).length, r1m: r.length ? r.reduce((a, c) => a + c, 0) / r.length : null};
}
function subHead(sec, g, mem){
  const st = grpStat(mem), sh = document.createElement("div"); sh.className = "sub";
  sh.dataset.sec = sec; sh.dataset.g = g; sh.dataset.k = CUR + "|" + sec + "|" + g;
  sh.appendChild(document.createTextNode(g));
  const k = document.createElement("small"); k.textContent = st.n; sh.appendChild(k);
  const t = document.createElement("span"); t.className = "st";
  // 정배열을 계산하지 않는 종목(환율·금리 등)뿐인 묶음에는 정배열 칸을 쓰지 않는다
  const part = [];
  if (mem.some(x => x.al != null)) part.push(`정배열 ${st.al}`);
  if (st.r1m != null) part.push(`1개월 <b class="${st.r1m >= 0 ? "up" : "dn"}">${pct(st.r1m)}</b>`);
  t.innerHTML = part.join(" · ");
  sh.appendChild(t);
  sh.title = "누르면 이 묶음을 접거나 펼칩니다.";
  return sh;
}
function setShut(sh, shut){
  const grp = sh.nextElementSibling;
  grp.hidden = shut; sh.classList.toggle("shut", shut);
  shut ? SHUT.add(sh.dataset.k) : SHUT.delete(sh.dataset.k);
  store.set("wl.shut", JSON.stringify([...SHUT]));
  if (sh.lab) sh.lab();
  foldLab();
  // 펼친 묶음의 차트는 화면에 들어올 때 다시 그리게 관찰을 새로 건다
  if (!shut && io) grp.querySelectorAll("canvas").forEach(cv => { const t = cv.closest(".card") || cv; io.unobserve(t); io.observe(t); });
  prog();
}
// 하부섹터 묶음으로 가서 펼친다(액션판·검색에서 씀). 걸러 보기·정렬 중이면 묶음이 없으니 먼저 처음 상태로.
function goGroup(sec, g){
  if (EFF !== "base" || ST.g === "all" || active(TAB) > 0){ reset(); save(); render(false); }
  const sh = [...$("main").querySelectorAll(".sub")].find(x => x.dataset.sec === sec && x.dataset.g === g);
  const si = TAB.sections.findIndex(s => s.name === sec);
  const tgt = sh || (SECINFO[si] && SECINFO[si].h);
  if (!tgt) return;
  if (sh && sh.classList.contains("shut")) setShut(sh, false);
  LOCK = true; if (si >= 0) light(si);
  jumpTo(tgt);
  if (sh){ sh.classList.remove("hit"); void sh.offsetWidth; sh.classList.add("hit"); }
}
// 탭 안 하부섹터 묶음별 정배열 수(오늘·20거래일 전)와 1개월 평균. 3종목 미만 묶음은 뺀다.
function alAt(it, back){
  const j = it.c.length - 1 - back, e = it.e;
  return j >= 0 && it.c[j] > e["20"][j] && e["20"][j] > e["50"][j] && e["50"][j] > e["200"][j];
}
function groupStats(data){
  const out = [];
  data.sections.forEach(s => {
    const by = {};
    s.items.forEach(it => { const g = (it.t || [])[0]; if (g) (by[g] = by[g] || []).push(it); });
    Object.entries(by).forEach(([g, mem]) => {
      if (mem.length < 3) return;
      out.push({sec: s.name, g, ...grpStat(mem), al20: mem.filter(it => alAt(it, 20)).length});
    });
  });
  return out;
}

// ── 상단 메뉴 위치 계산 ──
const hdr = $("hdr");
const hdrBottom = () => hdr.getBoundingClientRect().bottom;
let HID = false;
function setHidden(h){
  if (!$("panel").hidden) h = false;
  HID = h; hdr.style.transform = h ? `translateY(-${$("hide").offsetHeight}px)` : "";
}
function pad(){ $("main").style.paddingTop = (hdr.offsetHeight - ($("panel").hidden ? 0 : $("panel").offsetHeight) + 8) + "px"; }
function jumpTo(h){
  // 이동하면 메뉴가 접히므로, 접힌 높이 기준으로 제목이 바로 보이게 한다
  const visible = hdr.offsetHeight - $("hide").offsetHeight - ($("panel").hidden ? 0 : $("panel").offsetHeight);
  JUMP = Date.now() + 600; setHidden(true);
  const go = () => window.scrollTo(0, h.getBoundingClientRect().top + window.scrollY - visible - 8);
  // 도착한 자리의 카드가 처음 그려지며 어림 높이(.card 의 contain-intrinsic-size)가 실제 높이로 바뀌면 제목이 밀리므로 두 번 더 맞춘다
  go(); requestAnimationFrame(() => requestAnimationFrame(() => { go(); setTimeout(go, 120); }));
}
let JUMP = 0;

// 지금 화면에 보이는 섹터의 버튼에 불을 켜고, 버튼 줄 가운데로 민다(손가락이 버튼 줄을 만지는 동안은 안 민다)
function light(cur){
  if (cur === SPY) return;
  SPY = cur;
  const row = $("secs"), bs = [...row.querySelectorAll("button[data-s]")];
  bs.forEach((b, i) => b.classList.toggle("on", i === cur));
  const b = bs[cur];
  if (!b || Date.now() < ROWBUSY) return;
  const l = b.offsetLeft - row.scrollLeft, r = l + b.offsetWidth;
  if (l < 60 || r > row.clientWidth - 8) row.scrollLeft = b.offsetLeft - (row.clientWidth - b.offsetWidth) / 2;
}
// 오른쪽 가는 막대: 지금 보는 섹터를 어디까지 봤는지(옆 숫자 = 몇 번째 종목/섹터 종목 수)
function prog(){
  const bar = $("prog");
  if (!HEADS.length){ bar.style.display = "none"; return; }
  const hh = hdrBottom(), line = hh + 24, vh = window.innerHeight;
  let cur = 0;
  for (let i = 0; i < HEADS.length; i++){ if (HEADS[i].getBoundingClientRect().top <= line) cur = i; else break; }
  const top = HEADS[cur].getBoundingClientRect().top;
  const end = cur + 1 < HEADS.length ? HEADS[cur + 1].getBoundingClientRect().top : $("main").getBoundingClientRect().bottom;
  const secH = Math.max(1, end - top), viewH = vh - hh;
  const trackTop = hh + 10, trackH = vh - hh - 20;
  const thumbH = Math.max(26, Math.min(trackH, trackH * viewH / secH));
  const p = Math.max(0, Math.min(1, (hh - top) / Math.max(1, secH - viewH)));
  const y = (trackH - thumbH) * p;
  bar.style.display = "block"; bar.style.top = trackTop + "px"; bar.style.height = trackH + "px";
  const th = bar.firstChild, lb = bar.lastChild;
  th.style.top = y + "px"; th.style.height = thumbH + "px";
  const cards = SCARDS[cur].filter(c => c.offsetParent); let k = 1;
  for (let i = 0; i < cards.length; i++){ if (cards[i].getBoundingClientRect().top <= hh + viewH * 0.45) k = i + 1; else break; }
  lb.textContent = cards.length ? k + "/" + cards.length : "접힘"; lb.style.top = (y + thumbH / 2) + "px";
}
function spy(){
  prog();
  if (!HEADS.length || LOCK) return;
  const line = hdrBottom() + 24;
  let cur = 0;
  for (let i = 0; i < HEADS.length; i++){ if (HEADS[i].getBoundingClientRect().top <= line) cur = i; else break; }
  light(HIDX[cur]);
}

async function openTab(id, restore){
  CUR = id; store.set("wl.tab", id);
  [...$("tabs").children].forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const main = $("main"); main.innerHTML = '<div id="msg">불러오는 중입니다.</div>'; $("secs").innerHTML = "";
  let data;
  const get = async t => (await fetch(`${DATA}${t}.json?t=${encodeURIComponent(META.updated)}`)).json();
  try {
    if (id === "all"){
      const ids = META.tabs.map(t => t.id).filter(t => t !== "macro");
      main.innerHTML = `<div id="msg">${ids.length}개 탭을 모두 불러오는 중입니다.<br>처음 한 번은 몇 초 걸립니다.</div>`;
      const ds = await Promise.all(ids.map(get));
      data = {id: "all", title: ALL.title, sections: ds.flatMap(d => d.sections.map(s => ({...s, name: (SHORT[d.id] || d.id) + " › " + s.name})))};
    } else data = await get(id);
  }
  catch(e){ main.innerHTML = '<div id="msg">자료를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>'; return; }
  if (CUR !== id) return;
  data.sections.forEach(s => s.items.forEach(metrics));
  // 새로 생긴 신호: 종목마다 마지막 거래일을 그 전 거래일과 비교(가장 최근 마지막 거래일보다 5일 넘게 앞선 종목은 빼려고 그날을 먼저 구한다)
  const days = data.sections.flatMap(s => s.items.filter(it => it.k && it.d.length).map(it => dnum(lastOf(it.d))));
  data.newest = days.length ? Math.max(...days) : 0;
  data.sections.forEach(s => s.items.forEach(it => { if (it.k) signals(it, data.newest); }));
  data.dup = dupSet(data);
  // 거래대금 순으로 보고 있었다면 원화 환산 환율을 먼저 받는다
  if (SORT[ST.s].fx && !FX){ await loadFx(); if (CUR !== id) return; }
  TAB = data;
  render(restore);
}

// RS선 보는 법(2026-11-21 사용자 요청). 매크로 탭을 뺀 탭 맨 위에 접어 두고, 펼침 여부는 브라우저에 기억한다.
const GUIDE_RS = `<summary>📈 RS선 보는 법<small>차트 아래 파란 선</small></summary><div class="gb">
<p class="one"><b>한 줄 요약: 파란 선이 올라가면 시장보다 강한 종목, 내려가면 약한 종목입니다.</b></p>
<p><b>① RS선이란</b><br>이 종목 주가를 시장 지수로 나눈 선입니다. 시장과 비교한 성적표라고 보면 됩니다.<br>
예) 주가 +10%, 지수 +5%면 시장보다 잘했으니 선이 오릅니다.<br>
예) 주가 −3%, 지수 −8%면 주가는 빠졌지만 시장보다 덜 빠졌으니 선이 오릅니다.<br>
예) 주가 +2%, 지수 +6%면 주가는 올랐지만 시장보다 덜 올랐으니 선이 내립니다.</p>
<p><b>② 차트에서 볼 것 3가지</b><br>

      if (x.fx && !all.some(it => it.m.tv != null)) return;
      if (x.g !== g){ g = x.g; w = group(g || "기준", NOTE[g] || ""); }
      btn(w, x.name, EFF === x.id, () => { if (ST.s !== x.id) ST.d = x.dd || "desc"; ST.s = x.id; if (x.fx && !FX){ const t0 = TAB; loadFx().then(() => { if (TAB === t0) apply(); }); } else apply(); });
    });
    const ft = document.createElement("div"); ft.className = "foot";
    const rs = document.createElement("button"); rs.textContent = "↺ 정렬 초기화"; rs.disabled = EFF === "base" && ST.g !== "all";
    rs.onclick = () => { ST.s = "base"; ST.d = "desc"; ST.g = "sec"; apply(); };
    const go = document.createElement("button"); go.className = "go"; go.textContent = "닫기"; go.onclick = () => openPanel("sort");
    ft.append(rs, go); pn.appendChild(ft);
  } else if (PANEL === "grid"){
    const any = active(data) > 0;
    sigBox(pn, data);
    const h = document.createElement("h3"); h.textContent = tabTitle(CUR);
    const hs = document.createElement("small"); hs.textContent = "섹터별 정배열 종목 수 / 전체, 1개월 평균 수익률 · 초록이 짙을수록 정배열 비율이 높습니다"; h.appendChild(hs); pn.appendChild(h);
    const gr = document.createElement("div"); gr.className = "grid"; pn.appendChild(gr);
    SECINFO.forEach((s, si) => {
      const b = document.createElement("button"), r = s.tot ? s.n / s.tot : 0;
      if (s.tr) b.style.background = `rgba(8,153,129,${Math.min(0.55, r * 1.4).toFixed(2)})`;
      const nb = document.createElement("b"); nb.textContent = s.name; b.appendChild(nb);
      b.insertAdjacentHTML("beforeend", `<span>${any ? "맞는 종목 " + s.hit + " · " : ""}${s.tr ? "정배열 " + s.n + " / " + s.tot : s.tot + "종목"}</span>` +
        `<span>1개월 평균 <b class="${s.r1m >= 0 ? "up" : "dn"}" style="display:inline;font-size:12px">${s.r1m == null ? "–" : pct(s.r1m)}</b></span>${s.tr ? `<i><u style="width:${(r * 100).toFixed(0)}%"></u></i>` : ""}`);
      b.disabled = !s.h;
      b.onclick = () => { openPanel("grid"); LOCK = true; light(si); jumpTo(s.h); };
      gr.appendChild(b);
    });
    // 하부섹터 순위: 강한 묶음, 새로 강해지는 묶음, 약한 묶음(3종목 이상 묶음만)
    const G = CUR === "macro" ? [] : groupStats(data);
    if (G.length){
      const ratio = x => x.al / x.n, up = x => (x.al - x.al20) / x.n, r1 = (x, d) => x.r1m == null ? d : x.r1m;
      const strong = [...G].sort((a, b) => ratio(b) - ratio(a) || r1(b, -1e9) - r1(a, -1e9)).slice(0, 8);
      const rising = G.filter(x => x.al > x.al20).sort((a, b) => up(b) - up(a) || r1(b, -1e9) - r1(a, -1e9)).slice(0, 5);
      const weak = [...G].filter(x => !strong.includes(x)).sort((a, b) => ratio(a) - ratio(b) || r1(a, 1e9) - r1(b, 1e9)).slice(0, 3);
      const list = (title, note, rows, cls) => {
        const hh = document.createElement("h3"); hh.textContent = title;
        const sm = document.createElement("small"); sm.textContent = note; hh.appendChild(sm); pn.appendChild(hh);
        const box = document.createElement("div"); box.className = "gl" + (cls ? " " + cls : ""); pn.appendChild(box);
        rows.forEach((x, i) => {
          const b = document.createElement("button"), d = x.al - x.al20;
          b.innerHTML = `<i>${i + 1}</i><b></b><span>정배열 ${x.al}/${x.n}` +
            (x.r1m == null ? "" : ` · 1개월 <em class="${x.r1m >= 0 ? "up" : "dn"}" style="font-style:normal;font-weight:700">${pct(x.r1m)}</em>`) +
            ` · ${d === 0 ? "20일 전과 같음" : "20일 전보다 " + (d > 0 ? "+" + d : d)}</span>`;
          const nb = b.querySelector("b"); nb.textContent = x.g;
          const ns = document.createElement("small"); ns.textContent = x.sec; nb.appendChild(ns);
          b.onclick = () => { openPanel("grid"); goGroup(x.sec, x.g); };
          box.appendChild(b);
        });
      };
      list("🔥 강한 묶음", "정배열 비율이 높은 하부섹터 · 누르면 그 묶음으로 갑니다", strong);
      if (rising.length) list("⬆ 새로 강해지는 묶음", "20거래일 전보다 정배열 종목이 가장 많이 늘어난 곳", rising);
      if (weak.length) list("약한 묶음", "정배열 비율이 가장 낮은 곳", weak, "weak");
    }
  }
}
$("fbtn").onclick = () => openPanel("flt");
$("sbtn").onclick = () => openPanel("sort");
$("vbtn").onclick = () => { ST.v = ST.v === "list" ? "chart" : "list"; save(); render(false); };
$("dim").onclick = () => openPanel(PANEL);
// ── 종목 검색: meta.json 의 색인(모든 탭)에서 티커·영문·한글·별칭·딱지로 찾는다. 한글 초성(ㅅㅅㅈㅈ)도 된다 ──
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const norm = v => (v || "").toLowerCase().replace(/[\s.\-·&,'()^/=]/g, "");
const cho = v => [...(v || "")].map(c => { const k = c.charCodeAt(0) - 0xac00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join("");
let SIDX = null, SHIT = [], SSEL = 0;
function sindex(){
  if (SIDX) return SIDX;
  SIDX = (META.index || []).map(([y, n, kn, al, t, tab, sec]) => {
    const base = y.replace(/\.[A-Z]+$/, "");
    const words = [y, base, n, kn, ...(al ? al.split("|") : []), ...(t ? t.split(" · ") : [])].filter(Boolean);
    return {y, n, kn, al, t, tab, sec, base: norm(base), keys: words.map(norm), ch: words.map(w => norm(cho(w)))};
  });
  return SIDX;
}
function sfind(q){
  const nq = norm(q); if (!nq) return [];
  const onlyCho = /^[ㄱ-ㅎ]+$/.test(nq);
  const out = [];
  sindex().forEach(e => {
    let sc = 9;
    if (e.base === nq || norm(e.y) === nq) sc = 0;
    else e.keys.forEach((k, i) => { if (k.startsWith(nq)) sc = Math.min(sc, i < 4 ? 1 : 3); else if (k.includes(nq)) sc = Math.min(sc, i < 4 ? 2 : 4); });
    if (sc === 9 && onlyCho) e.ch.forEach(k => { if (k.startsWith(nq)) sc = Math.min(sc, 5); else if (k.includes(nq)) sc = Math.min(sc, 6); });
    if (sc < 9) out.push([sc, e]);
  });
  return out.sort((a, b) => a[0] - b[0]).slice(0, 40).map(x => x[1]);
}
function sdraw(){
  const q = $("sq").value, box = $("sres"); box.innerHTML = "";
  SHIT = sfind(q); SSEL = 0;
  if (!q.trim()){ box.innerHTML = '<p>티커(NVDA, 000660), 영문(nvidia), 한글(엔비디아, 하닉), 초성(ㅅㅅㅈㅈ), 딱지(HBM)로 찾을 수 있습니다.</p>'; return; }
  SHIT = sgroups(q).concat(SHIT);
  if (!SHIT.length){ box.innerHTML = '<p>찾는 종목이 차트북에 없습니다.</p>'; return; }
  SHIT.forEach((e, i) => {
    const b = document.createElement("button"); b.classList.toggle("on", i === 0);
    if (e.grp){
      b.className = "grp" + (i === 0 ? " on" : "");
      const nm = document.createElement("b"); nm.textContent = "묶음 · " + e.g;
      const sm = document.createElement("small"); sm.textContent = e.n + "종목"; nm.appendChild(sm);
      const ln = document.createElement("span"); ln.textContent = (SHORT[e.tab] || e.tab) + " › " + e.sec;
      b.append(nm, ln); b.onclick = () => sgo(e); box.appendChild(b); return;
    }
    const nm = document.createElement("b"); nm.textContent = e.kn && e.kn !== e.n ? e.kn : e.n;
    const sm = document.createElement("small"); sm.textContent = (e.kn && e.kn !== e.n ? e.n + " · " : "") + e.y; nm.appendChild(sm);
    const ln = document.createElement("span"); ln.textContent = (SHORT[e.tab] || e.tab) + " › " + e.sec + (e.t ? " · " : "");
    if (e.t){ const em = document.createElement("em"); em.textContent = e.t; ln.appendChild(em); }
    b.append(nm, ln); b.onclick = () => sgo(e); box.appendChild(b);
  });
}
// 하부섹터(첫 딱지) 이름이 맞는 묶음. 두 글자 이상일 때만, 3개까지
function sgroups(q){
  const nq = norm(q); if (nq.length < 2) return [];
  const by = {};
  sindex().forEach(e => {
    const g = (e.t || "").split(" · ")[0]; if (!g) return;
    const ng = norm(g); if (!ng.includes(nq)) return;
    const k = e.tab + "|" + e.sec + "|" + g;
    (by[k] = by[k] || {grp: true, tab: e.tab, sec: e.sec, g, n: 0, sc: ng.startsWith(nq) ? 0 : 1}).n++;
  });
  return Object.values(by).filter(x => x.n >= 2).sort((a, b) => a.sc - b.sc || b.n - a.n).slice(0, 3);
}
function sopen(){ $("srch").hidden = false; $("sq").value = ""; sdraw(); setTimeout(() => $("sq").focus(), 30); }
function sclose(){ $("srch").hidden = true; $("sq").blur(); }
async function sgo(e){
  sclose();
  if (PANEL) openPanel(PANEL);
  if (CUR !== e.tab || !TAB) await openTab(e.tab, false);
  if (e.grp){ goGroup(e.sec, e.g); return; }
  goStock(e.y);
}
// 지금 탭에서 그 종목 카드(표 보기면 줄)로 간다. 검색과 '▦ 전체' 판의 새 신호 목록이 쓴다
function goStock(y){
  const pick = () => [...$("main").querySelectorAll("[data-y]")].find(x => x.dataset.y === y);
  let el = pick();
  // 걸러 보기·정렬 때문에 안 보이면 조건을 풀고 기본 순서로 다시 그린다
  if (!el){ reset(); save(); render(false); el = pick(); }
  if (!el) return;
  // 접힌 묶음 안이면 펼친다
  const gp = el.closest(".grp");
  if (gp && gp.hidden) setShut(gp.previousElementSibling, false);
  jumpTo(el);
  el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
}
$("qbtn").onclick = sopen;
$("sx").onclick = sclose;
$("sq").addEventListener("input", sdraw);
$("sq").addEventListener("keydown", ev => {
  if (ev.key === "Escape") sclose();
  else if (ev.key === "Enter" && SHIT.length){ ev.preventDefault(); sgo(SHIT[SSEL]); }
  else if ((ev.key === "ArrowDown" || ev.key === "ArrowUp") && SHIT.length){
    ev.preventDefault(); SSEL = (SSEL + (ev.key === "ArrowDown" ? 1 : SHIT.length - 1)) % SHIT.length;
    [...$("sres").children].forEach((b, i) => b.classList.toggle("on", i === SSEL)); $("sres").children[SSEL].scrollIntoView({block: "nearest"});
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "/" && $("srch").hidden && document.activeElement.tagName !== "INPUT"){ ev.preventDefault(); sopen(); } });
// 딱지(.bd span)·표의 RS 칸을 누르면 그 풀이(title)를 아래 상자에 띄운다. 다시 누르거나 아무 데나 누르면 닫힌다.
document.addEventListener("click", ev => {
  const tg = ev.target.closest && ev.target.closest(".bd span[title], .kv span[title], .lg span[title], .sgi[title], .tr .s[title], .biz .tg[title]"), tip = $("tip");
  if (!tg){ tip.hidden = true; return; }
  ev.stopPropagation();
  if (!tip.hidden && tip.dataset.for === tg.title){ tip.hidden = true; return; }
  tip.textContent = tg.title; tip.dataset.for = tg.title;
  const sm = document.createElement("small"); sm.textContent = "아무 데나 누르면 닫힙니다"; tip.appendChild(sm);
  tip.hidden = false;
}, true);
$("totop").onclick = () => { JUMP = Date.now() + 600; setHidden(false); window.scrollTo(0, 0); };

// ── 스크롤: 아래로 내리면 메뉴 윗부분을 접고, 위로 올리면 편다 ──
let tick = 0, spyTick = 0, lastY = 0, progT = 0;
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  if (Date.now() > JUMP && !PANEL){
    if (y > lastY + 6 && y > 140) setHidden(true);
    else if (y < lastY - 6 || y < 60) setHidden(false);
  }
  lastY = y;
  $("prog").classList.add("show"); clearTimeout(progT); progT = setTimeout(() => $("prog").classList.remove("show"), 1100);
  $("totop").classList.toggle("on", y > window.innerHeight * 1.5);
  if (!spyTick) spyTick = requestAnimationFrame(() => { spyTick = 0; spy(); });
  if (tick) return;
  tick = setTimeout(() => { tick = 0; if (CUR) store.set("wl.y." + CUR, String(Math.round(window.scrollY))); }, 400);
}, {passive: true});
hdr.addEventListener("transitionend", () => prog());
let rz = 0;
window.addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { pad(); if (HID) setHidden(true); prog(); document.querySelectorAll("canvas").forEach(cv => { if (cv.width && cv.clientWidth && cv.dataset.w != cv.clientWidth){ draw(cv, ITEMS[cv.dataset.i]); cv.dataset.w = cv.clientWidth; } }); }, 200);
});
["touchstart","touchmove","pointerdown","wheel"].forEach(ev => $("secs").addEventListener(ev, () => { ROWBUSY = Date.now() + 2500; }, {passive: true}));

(async () => {
  try { META = await (await fetch(DATA + "meta.json?t=" + Date.now())).json(); }
  catch(e){ $("msg").textContent = "자료를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요."; return; }
  $("qbtn").hidden = !(META.index && META.index.length);
  const up = $("upd"); up.textContent = META.updated.slice(5).replace("-", "/") + " KST 갱신";
  const age = (Date.now() - new Date(META.updated.replace(" ", "T") + ":00+09:00")) / 36e5;
  if (age > 80) { up.classList.add("old"); up.textContent += " (오래됨)"; }
  [ALL, ...META.tabs].forEach(t => {
    const b = document.createElement("button"); b.dataset.id = t.id; b.textContent = SHORT[t.id] || t.title; b.title = t.title;
    b.onclick = () => { if (PANEL) openPanel(PANEL); openTab(t.id, false); };
    $("tabs").appendChild(b);
  });
  pad();
  const saved = store.get("wl.tab");
  openTab(saved === "all" || META.tabs.some(t => t.id === saved) ? saved : META.tabs[0].id, true);
})();
